<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1620" viewBox="0 0 1760 1620" style="max-width:100%;height:auto" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">Internet access with subscription keys or Entra ID through APIM Standard v2</title>
<desc id="diagram-description">Configured public HTTPS access for Internet users and systems. Each original model API requires its API-scoped subscription key. Three separate Entra APIs require a gateway-audience access token and the matching Model.Gpt.Invoke, Model.Phi.Invoke or Model.DeepSeek.Invoke role. Both choices pin one of three existing Foundry deployments and use APIM&#x27;s system-assigned managed identity, Foundry User at account scope, outbound VNet integration and the Foundry private endpoint. Foundry public access and local/API-key authentication remain disabled.</desc>
<defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#0078D4" stroke-width="1.6" stroke-linejoin="round"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#5C2D91" stroke-width="1.6" stroke-linejoin="round"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#107C10" stroke-width="1.6" stroke-linejoin="round"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#F7630C" stroke-width="1.6" stroke-linejoin="round"/></marker>
<marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#737373" stroke-width="1.6" stroke-linejoin="round"/></marker>
</defs>
<rect width="1760" height="1620" fill="#FFFFFF"/>
<g font-family="Segoe UI, Arial, sans-serif">
<rect id="apim-foundry-internet-1" x="48" y="38" width="60" height="44" rx="12" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
<text id="apim-foundry-internet-2" fill="#000000" font-size="26" font-weight="600" data-max-width="38"><tspan x="61" y="69">01</tspan></text>
<text id="apim-foundry-internet-3" fill="#000000" font-size="34" font-weight="600" data-max-width="1580"><tspan x="130" y="74">Internet access | APIM Standard v2 + Foundry</tspan></text>
<text id="apim-foundry-internet-4" fill="#000000" font-size="19" data-max-width="1664"><tspan x="48" y="119">Internet clients use model-scoped keys or separate Entra APIs; APIM reaches Foundry over private HTTPS.</tspan></text>
<rect id="apim-foundry-internet-5" x="48" y="145" width="1664" height="82" rx="12" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
<text id="apim-foundry-internet-6" fill="#000000" font-size="22" font-weight="600" data-max-width="1618"><tspan x="70" y="181">One model key OR one assigned model role -&gt; one protected API -&gt; one pinned deployment</tspan></text>
<text id="apim-foundry-internet-7" fill="#000000" font-size="18" data-max-width="1618"><tspan x="70" y="210">Additive Entra access keeps the original subscription keys, products and API URLs unchanged.</tspan></text>
<text id="apim-foundry-internet-8" fill="#000000" font-size="24" font-weight="600" data-max-width="1664"><tspan x="48" y="279">1   Public entry, private backend</tspan></text>
<rect id="apim-foundry-internet-9" x="690" y="305" width="620" height="275" rx="12" fill="none" stroke="#737373" stroke-width="2" stroke-dasharray="9 7"/>
<text id="apim-foundry-internet-10" fill="#000000" font-size="17" font-weight="600" data-max-width="580"><tspan x="710" y="335">EXISTING VNET | 10.42.0.0/16 (example)</tspan></text>
<rect id="apim-foundry-internet-11" x="48" y="370" width="240" height="182" rx="12" fill="#F3F2F1" stroke="#737373" stroke-width="2"/>
<text id="apim-foundry-internet-12" fill="#000000" font-size="21" font-weight="600" data-max-width="204" data-box-x="48" data-box-y="370" data-box-width="240" data-box-height="182"><tspan x="66" y="409">Users / systems</tspan></text>
<text id="apim-foundry-internet-13" fill="#000000" font-size="17" data-max-width="204" data-box-x="48" data-box-y="370" data-box-width="240" data-box-height="182"><tspan x="66" y="442">Internet clients</tspan><tspan x="66" y="465.8">Choose key or Entra API</tspan><tspan x="66" y="489.6">Send its key or user token</tspan></text>
<rect id="apim-foundry-internet-14" x="360" y="370" width="290" height="182" rx="12" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
<text id="apim-foundry-internet-15" fill="#000000" font-size="21" font-weight="600" data-max-width="254" data-box-x="360" data-box-y="370" data-box-width="290" data-box-height="182"><tspan x="378" y="409">APIM Standard v2</tspan></text>
<text id="apim-foundry-internet-16" fill="#000000" font-size="17" data-max-width="254" data-box-x="360" data-box-y="370" data-box-width="290" data-box-height="182"><tspan x="378" y="442">Public gateway</tspan><tspan x="378" y="465.8">APIM_NAME.azure-api.net</tspan><tspan x="378" y="489.6">Key or per-model role gate</tspan></text>
<rect id="apim-foundry-internet-17" x="720" y="370" width="250" height="182" rx="12" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
<text id="apim-foundry-internet-18" fill="#000000" font-size="19" font-weight="600" data-max-width="214" data-box-x="720" data-box-y="370" data-box-width="250" data-box-height="182"><tspan x="738" y="407">Outbound integration</tspan></text>
<text id="apim-foundry-internet-19" fill="#000000" font-size="16" data-max-width="214" data-box-x="720" data-box-y="370" data-box-width="250" data-box-height="182"><tspan x="738" y="441">snet-aigw-outbound</tspan><tspan x="738" y="463.4">10.42.2.0/24</tspan><tspan x="738" y="485.8">Microsoft.Web/serverFarms</tspan></text>
<rect id="apim-foundry-internet-20" x="1030" y="370" width="250" height="182" rx="12" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
<text id="apim-foundry-internet-21" fill="#000000" font-size="18" font-weight="600" data-max-width="214" data-box-x="1030" data-box-y="370" data-box-width="250" data-box-height="182"><tspan x="1048" y="406">Foundry private endpoint</tspan></text>
<text id="apim-foundry-internet-22" fill="#000000" font-size="16" data-max-width="214" data-box-x="1030" data-box-y="370" data-box-width="250" data-box-height="182"><tspan x="1048" y="441">snet-foundry-inbound</tspan><tspan x="1048" y="463.4">10.42.0.0/24</tspan><tspan x="1048" y="485.8">Subresource: account</tspan></text>
<rect id="apim-foundry-internet-23" x="1370" y="370" width="342" height="182" rx="12" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
<text id="apim-foundry-internet-24" fill="#000000" font-size="21" font-weight="600" data-max-width="306" data-box-x="1370" data-box-y="370" data-box-width="342" data-box-height="182"><tspan x="1388" y="409">Microsoft Foundry</tspan></text>
<text id="apim-foundry-internet-25" fill="#000000" font-size="17" data-max-width="306" data-box-x="1370" data-box-y="370" data-box-width="342" data-box-height="182"><tspan x="1388" y="442">Public access: disabled</tspan><tspan x="1388" y="465.8">Local/API-key auth: disabled</tspan><tspan x="1388" y="489.6">Three model deployments</tspan></text>
<polyline id="apim-foundry-internet-26" points="288,462 360,462" fill="none" stroke="#0078D4" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<polyline id="apim-foundry-internet-27" points="650,462 720,462" fill="none" stroke="#0078D4" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<polyline id="apim-foundry-internet-28" points="970,462 1030,462" fill="none" stroke="#107C10" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<polyline id="apim-foundry-internet-29" points="1280,462 1370,462" fill="none" stroke="#107C10" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<text id="apim-foundry-internet-30" fill="#000000" font-size="15" font-weight="600" data-max-width="50"><tspan x="302" y="443">TLS</tspan></text>
<text id="apim-foundry-internet-31" fill="#000000" font-size="15" font-weight="600" data-max-width="50"><tspan x="662" y="443">TLS</tspan></text>
<text id="apim-foundry-internet-32" fill="#000000" font-size="15" font-weight="600" data-max-width="40"><tspan x="985" y="443">443</tspan></text>
<text id="apim-foundry-internet-33" fill="#000000" font-size="15" font-weight="600" data-max-width="65"><tspan x="1294" y="443">TLS</tspan></text>
<text id="apim-foundry-internet-34" fill="#000000" font-size="17" data-max-width="1664"><tspan x="48" y="607">Request arrows shown; responses and server-sent event (SSE) streams return on the same connections.</tspan></text>
<text id="apim-foundry-internet-41" fill="#000000" font-size="24" font-weight="600" data-max-width="1664"><tspan x="48" y="655">2   Choose the caller authentication path</tspan></text>
<rect id="apim-foundry-internet-42" x="48" y="686" width="790" height="264" rx="12" fill="none" stroke="#0078D4" stroke-width="2"/>
<text id="apim-foundry-internet-43" fill="#000000" font-size="22" font-weight="600" data-max-width="750"><tspan x="68" y="726">A | Subscription key (configured)</tspan></text>
<text id="apim-foundry-internet-44" fill="#000000" font-size="19" data-max-width="750"><tspan x="68" y="766">Ocp-Apim-Subscription-Key: &lt;MODEL_KEY&gt;</tspan></text>
<text id="apim-foundry-internet-45" fill="#000000" font-size="18" data-max-width="750"><tspan x="68" y="804">The three original APIs require a matching API-scoped key.</tspan><tspan x="68" y="829.2">API policies validate the model and pin the backend.</tspan><tspan x="68" y="854.4">The same key works over public or private ingress.</tspan><tspan x="68" y="879.6">A bearer token alone does not authorize these key APIs.</tspan></text>
<rect id="apim-foundry-internet-46" x="880" y="686" width="832" height="264" rx="12" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="apim-foundry-internet-47" fill="#000000" font-size="22" font-weight="600" data-max-width="792"><tspan x="900" y="726">B | Entra ID token only (configured)</tspan></text>
<rect id="apim-foundry-internet-48" x="902" y="747" width="226" height="58" rx="12" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/>
<text id="apim-foundry-internet-49" fill="#000000" font-size="19" font-weight="600" data-max-width="194"><tspan x="918" y="779">User / workload</tspan></text>
<rect id="apim-foundry-internet-50" x="1204" y="747" width="234" height="58" rx="12" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/>
<text id="apim-foundry-internet-51" fill="#000000" font-size="19" font-weight="600" data-max-width="202"><tspan x="1220" y="779">Microsoft Entra ID</tspan></text>
<polyline id="apim-foundry-internet-52" points="1128,776 1204,776" fill="none" stroke="#5C2D91" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
<text id="apim-foundry-internet-53" fill="#000000" font-size="18" data-max-width="792"><tspan x="900" y="841">Acquire an access token for the registered gateway API.</tspan><tspan x="900" y="866.2">Authorization: Bearer &lt;ACCESS_TOKEN&gt;</tspan><tspan x="900" y="891.4">Validate tenant, audience, signature, expiry + model role.</tspan><tspan x="900" y="916.6">No key is required here; a key cannot replace the token.</tspan></text>
<text id="apim-foundry-internet-54" fill="#000000" font-size="24" font-weight="600" data-max-width="1664"><tspan x="48" y="1014">3   Per-model authorization stays separate</tspan></text>
<text id="apim-foundry-internet-55" fill="#000000" font-size="17" data-max-width="1664"><tspan x="48" y="1044">Separate key and Entra URLs authorize the same model; both reuse the private backend and APIM identity.</tspan></text>
<text id="apim-foundry-internet-56" fill="#000000" font-size="16" font-weight="600" data-max-width="620"><tspan x="66" y="1079">KEY PATH (EXISTING API)</tspan></text>
<text id="apim-foundry-internet-57" fill="#000000" font-size="16" font-weight="600" data-max-width="500"><tspan x="750" y="1079">TOKEN PATH (ENTRA API)</tspan></text>
<text id="apim-foundry-internet-58" fill="#000000" font-size="16" font-weight="600" data-max-width="356"><tspan x="1338" y="1079">ONLY FOUNDRY DEPLOYMENT</tspan></text>
<rect id="apim-foundry-internet-59" x="48" y="1097" width="620" height="68" rx="12" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
<text id="apim-foundry-internet-60" fill="#000000" font-size="18" font-weight="600" data-max-width="584"><tspan x="66" y="1125">K_GPT -&gt; API gpt5-4mini</tspan></text>
<text id="apim-foundry-internet-61" fill="#000000" font-size="16" data-max-width="584"><tspan x="66" y="1152">/gpt5-4mini/openai/v1</tspan></text>
<rect id="apim-foundry-internet-62" x="732" y="1097" width="500" height="68" rx="12" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/>
<text id="apim-foundry-internet-63" fill="#000000" font-size="18" font-weight="600" data-max-width="464"><tspan x="750" y="1124">Required role: Model.Gpt.Invoke</tspan></text>
<text id="apim-foundry-internet-64" fill="#000000" font-size="16" data-max-width="464"><tspan x="750" y="1152">/entra/gpt5-4mini/openai/v1</tspan></text>
<text id="apim-foundry-internet-65" fill="#000000" font-size="17" font-weight="600" data-max-width="42"><tspan x="684" y="1137">OR</tspan></text>
<polyline id="apim-foundry-internet-66" points="1232,1131 1320,1131" fill="none" stroke="#0078D4" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect id="apim-foundry-internet-67" x="1320" y="1097" width="392" height="68" rx="12" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
<text id="apim-foundry-internet-68" fill="#000000" font-size="20" font-weight="600" data-max-width="356"><tspan x="1338" y="1127">Gpt5.4mini</tspan></text>
<text id="apim-foundry-internet-69" fill="#000000" font-size="16" data-max-width="356"><tspan x="1338" y="1152">Same fixed backend / model</tspan></text>
<rect id="apim-foundry-internet-70" x="48" y="1179" width="620" height="68" rx="12" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/>
<text id="apim-foundry-internet-71" fill="#000000" font-size="18" font-weight="600" data-max-width="584"><tspan x="66" y="1207">K_PHI -&gt; API phi</tspan></text>
<text id="apim-foundry-internet-72" fill="#000000" font-size="16" data-max-width="584"><tspan x="66" y="1234">/phi/openai/v1</tspan></text>
<rect id="apim-foundry-internet-73" x="732" y="1179" width="500" height="68" rx="12" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/>
<text id="apim-foundry-internet-74" fill="#000000" font-size="18" font-weight="600" data-max-width="464"><tspan x="750" y="1206">Required role: Model.Phi.Invoke</tspan></text>
<text id="apim-foundry-internet-75" fill="#000000" font-size="16" data-max-width="464"><tspan x="750" y="1234">/entra/phi/openai/v1</tspan></text>
<text id="apim-foundry-internet-76" fill="#000000" font-size="17" font-weight="600" data-max-width="42"><tspan x="684" y="1219">OR</tspan></text>
<polyline id="apim-foundry-internet-77" points="1232,1213 1320,1213" fill="none" stroke="#5C2D91" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
<rect id="apim-foundry-internet-78" x="1320" y="1179" width="392" height="68" rx="12" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/>
<text id="apim-foundry-internet-79" fill="#000000" font-size="20" font-weight="600" data-max-width="356"><tspan x="1338" y="1209">Phi</tspan></text>
<text id="apim-foundry-internet-80" fill="#000000" font-size="16" data-max-width="356"><tspan x="1338" y="1234">Same fixed backend / model</tspan></text>
<rect id="apim-foundry-internet-81" x="48" y="1261" width="620" height="68" rx="12" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
<text id="apim-foundry-internet-82" fill="#000000" font-size="18" font-weight="600" data-max-width="584"><tspan x="66" y="1289">K_DEEPSEEK -&gt; API fw-deepseek-v4-1-flash</tspan></text>
<text id="apim-foundry-internet-83" fill="#000000" font-size="16" data-max-width="584"><tspan x="66" y="1316">/fw-deepseek-v4-1-flash/openai/v1</tspan></text>
<rect id="apim-foundry-internet-84" x="732" y="1261" width="500" height="68" rx="12" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/>
<text id="apim-foundry-internet-85" fill="#000000" font-size="18" font-weight="600" data-max-width="464"><tspan x="750" y="1288">Required role: Model.DeepSeek.Invoke</tspan></text>
<text id="apim-foundry-internet-86" fill="#000000" font-size="16" data-max-width="464"><tspan x="750" y="1316">/entra/fw-deepseek-v4-1-flash/openai/v1</tspan></text>
<text id="apim-foundry-internet-87" fill="#000000" font-size="17" font-weight="600" data-max-width="42"><tspan x="684" y="1301">OR</tspan></text>
<polyline id="apim-foundry-internet-88" points="1232,1295 1320,1295" fill="none" stroke="#107C10" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<rect id="apim-foundry-internet-89" x="1320" y="1261" width="392" height="68" rx="12" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
<text id="apim-foundry-internet-90" fill="#000000" font-size="20" font-weight="600" data-max-width="356"><tspan x="1338" y="1291">FW-DeepSeek-V4.1-Flash</tspan></text>
<text id="apim-foundry-internet-91" fill="#000000" font-size="16" data-max-width="356"><tspan x="1338" y="1316">Same fixed backend / model</tspan></text>
<rect id="apim-foundry-internet-92" x="48" y="1368" width="1664" height="83" rx="12" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
<text id="apim-foundry-internet-93" fill="#000000" font-size="22" font-weight="600" data-max-width="1624"><tspan x="68" y="1403">Both paths -&gt; APIM system-assigned identity -&gt; Foundry User (account scope)</tspan></text>
<text id="apim-foundry-internet-94" fill="#000000" font-size="18" data-max-width="1624"><tspan x="68" y="1434">Backend token audience: https://cognitiveservices.azure.com/ | Do not forward the caller&#x27;s bearer token to Foundry.</tspan></text>
<text id="apim-foundry-internet-95" fill="#000000" font-size="16" data-max-width="1664"><tspan x="48" y="1481">Entra APIs: Subscription required = No; missing/invalid token -&gt; 401; missing model role -&gt; 403.</tspan></text>
<text id="apim-foundry-internet-96" fill="#000000" font-size="16" data-max-width="1664"><tspan x="48" y="1511">Routes above are API bases: append /chat/completions (POST, HTTPS 443).</tspan></text>
<text id="apim-foundry-internet-97" fill="#000000" font-size="16" data-max-width="1664"><tspan x="48" y="1537">Caller token audience: registered gateway API client ID; only explicitly assigned model roles grant access.</tspan></text>
<text id="apim-foundry-internet-98" fill="#000000" font-size="16" data-max-width="1664"><tspan x="48" y="1563">Products catalog the three key APIs. The three additional Entra APIs do not create more Foundry deployments.</tspan></text>
<text id="apim-foundry-internet-99" fill="#000000" font-size="16" data-max-width="1664"><tspan x="48" y="1589">Off this path: APIM inbound PE (10.42.3.0/24); Foundry agent outbound subnet (10.42.1.0/24).</tspan></text>
</g>
</svg>
